name: Refresh data

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # every 30 min through US market hours (13:00–21:00 UTC, Mon–Fri).
    # Off-peak minutes (7/37) — GitHub heavily throttles :00/:30 cron slots
    # and can skip them outright.
    - cron: "7,37 13-20 * * 1-5"
    # once after the close
    - cron: "13 21 * * 1-5"
    # weekends: twice daily (ENA still trades)
    - cron: "19 12,22 * * 0,6"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run pipeline
        run: |
          python fetch_data.py
          python build_dashboard_data.py

      # EthenaPay tab. Kept separate and non-blocking: a Dune outage or a
      # missing key must not stop the NAV tracker from refreshing.
      - name: Refresh EthenaPay data
        continue-on-error: true
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        run: python fetch_ethenapay.py

      # The site reads data.json and ethenapay.json from the GitHub raw feed at
      # runtime, so committing refreshed data is enough to update the live page.
      # Changes to docs/index.html itself still need `wrangler deploy` — the site
      # has been served by a Worker (not Pages) since 2026-09-11.
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ docs/data.json docs/ethenapay.json
          git diff --cached --quiet || git commit -m "Auto-refresh data [skip ci]"
          git push
