name: Refresh data and deploy dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # every 30 min through US market hours (13:00–21:00 UTC, Mon–Fri)
    - cron: "*/30 13-20 * * 1-5"
    # once after the close
    - cron: "10 21 * * 1-5"
    # weekends: twice daily (ENA still trades)
    - cron: "0 12,22 * * 0,6"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run pipeline
        run: |
          python fetch_data.py
          python build_dashboard_data.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ docs/data.json
          git diff --cached --quiet || git commit -m "Auto-refresh data [skip ci]"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
