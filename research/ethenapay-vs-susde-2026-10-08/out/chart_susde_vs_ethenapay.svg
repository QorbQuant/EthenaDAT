<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 466" role="img" aria-labelledby="sv-t sv-d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title id="sv-t">sUSDe's daily rate against EthenaPay's rates, September 1 to October 8, 2026</title>
<desc id="sv-d">Line chart of 38 days. sUSDe's rate a year after compounding, from the change in its share price over each UTC day, ranged between 4.49% on September 5 and 5.28% on October 1. Three step lines show the rates EthenaPay's payments were set at. Within their caps the Pro and VIP rate was 6.08% until September 15 and 6.07% from September 17, and the rate on the first $5,000 of a Standard balance was 5.04% and then 5.02%. Balance above a cap earned the base rate, 4.0% until September 16 and 4.5% from September 17. On September 16 the Boost had already fallen and the base not yet risen, so both tier lines dip. sUSDe stayed above the base rate and below the Pro and VIP rate on every day, and paid more than the Standard rate on 10 days.</desc>
