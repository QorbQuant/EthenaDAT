<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 466" role="img" aria-labelledby="cf-t cf-d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title id="cf-t">USDe into and out of EthenaPay wallets, May 15 to October 5, 2026</title>
<desc id="cf-d">Waterfall. Deposits of 11,056,938 USDe, less withdrawals of 4,728,154 and card spend of 2,470,249, plus reversals of 104,429 and USDe rewards of 17,190, left 3,980,154 USDe held at the end of October 5, 2026.</desc>
