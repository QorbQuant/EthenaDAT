<text x="20" y="30" fill="var(--sx-text, #eeeae3)" font-size="16" font-weight="600">617 wallets spent in the seven days to October 4, 2026, up from 92 before the beta</text>
<text x="20" y="52" fill="var(--sx-muted, #99a3b0)" font-size="12">Distinct EthenaPay wallets with a spend event, by seven-day period</text>
