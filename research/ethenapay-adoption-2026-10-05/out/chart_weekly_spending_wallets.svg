<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 466" role="img" aria-labelledby="wk-t wk-d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title id="wk-t">Distinct EthenaPay spending wallets by seven-day period, August 3 to October 4, 2026</title>
<desc id="wk-d">Stacked column chart. Distinct wallets with a qualifying spend event rose from 48 in the seven days to August 9 to 92 in the last full period before the beta and 617 in the seven days to October 4. In the latest period 425 of the wallets had also spent in the period before and 192 had not.</desc>
