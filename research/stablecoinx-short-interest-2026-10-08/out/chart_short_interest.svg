<title id="si-t">USDE daily close and FINRA short interest, June 26 to October 8, 2026</title>
<desc id="si-d">Two panels on one time axis. USDE closed at $3.70 on June 26, fell to a low close of $1.43 on July 24 and rose to $17.25 on September 25 before closing at $12.79 on October 8. Short interest at the seven settlement dates was 12,599, 277,768, 261,864, 196,109, 1,232,013, 1,579,478 and 2,810,986 shares.</desc>
