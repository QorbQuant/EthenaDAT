<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 466" role="img" aria-labelledby="rs-t rs-d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title id="rs-t">EthenaPay repeat spending by week of first spend, to October 4, 2026</title>
<desc id="rs-d">Two lines. Wallets that first spent from August 31 to September 27, 519 in all, 80% in week 1 of 519 observed, 70% in week 2 of 391 observed, 75% in week 3 of 218 observed, 71% in week 4 of 126 observed. Wallets that first spent from June 4 to August 30, 131 in all, 72% in week 1, 66% in week 2, 62% in week 3, 62% in week 4, 63% in week 5.</desc>
<rect width="800" height="466" fill="var(--sx-bg, #0d1116)"/>
<text x="20" y="30" fill="var(--sx-text, #eeeae3)" font-size="16" font-weight="600">Four in five wallets of the first four beta cohorts spent again the next week</text>
<text x="20" y="52" fill="var(--sx-muted, #99a3b0)" font-size="12">Share of wallets with a spend event in each week after their first spend, weeks to October 4, 2026.</text>
